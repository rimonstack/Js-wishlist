<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Book Wishlist</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background: #f8f5fc;
      display: flex;
      justify-content: center;
      padding: 30px 15px;
      margin: 0;
    }
    .card {
      background: white;
      padding: 25px;
      border-radius: 15px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 4px 15px #ddd;
    }
    h2 { text-align: center; color: #75558c; }
    .input-area { display: flex; gap: 8px; }
    input[type="text"] {
      flex: 1;
      min-width: 0;
      padding: 11px;
      border: 1px solid #d5c5e5;
      border-radius: 8px;
    }
    button {
      border: none;
      padding: 10px 14px;
      border-radius: 8px;
      background: #a88bc2;
      color: white;
      cursor: pointer;
    }
    ul { padding: 0; list-style: none; }
    li {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px;
      margin-top: 10px;
      background: #f6f1fa;
      border-radius: 8px;
    }
    li span { flex: 1; overflow-wrap: anywhere; }
    .done { text-decoration: line-through; opacity: 0.5; }
    .delete { background: #d98c9b; }
  </style>
</head>
<body>
  <main class="card">
    <h2>📚 My Book Wishlist</h2>
    <div class="input-area">
      <input id="bookInput" type="text" placeholder="Enter book name..." aria-label="Book name">
      <button type="button" onclick="addBook()">+ Add</button>
    </div>
    <ul id="bookList" aria-label="Book wishlist"></ul>
  </main>

  <script>
    function addBook() {
      const input = document.getElementById("bookInput");
      const name = input.value.trim();

      if (!name) {
        alert("Please enter a book name!");
        input.focus();
        return;
      }

      const li = document.createElement("li");
      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.setAttribute("aria-label", "Mark as read");

      const title = document.createElement("span");
      title.textContent = name;

      checkbox.addEventListener("change", () => {
        title.classList.toggle("done", checkbox.checked);
      });

      const remove = document.createElement("button");
      remove.type = "button";
      remove.textContent = "×";
      remove.className = "delete";
      remove.setAttribute("aria-label", `Delete ${name}`);
      remove.addEventListener("click", () => li.remove());

      li.append(checkbox, title, remove);
      document.getElementById("bookList").appendChild(li);

      input.value = "";
      input.focus();
    }

    document.getElementById("bookInput").addEventListener("keydown", (event) => {
      if (event.key === "Enter") addBook();
    });
  </script>
</body>
</html>
